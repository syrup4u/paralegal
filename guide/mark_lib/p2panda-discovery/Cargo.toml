[package]
name = "p2panda-discovery"
version = "0.5.2"
edition = "2024"
authors = [
  "adz <x12@adz.garden>",
  "jackaperkins <jackaperkins@posteo.net>",
]
description = "Confidential topic and node discovery protocol"
repository = "https://github.com/p2panda/p2panda"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["p2p", "discovery", "confidential"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
default = []
random_walk = [
  "dep:tokio",
]
test_utils = [
  "dep:rand_chacha",
]

[dependencies]
blake3 = "=1.8.1"
futures-util = { version = "0.3.31", features = ["sink"], default-features = false }
paralegal = { path = "../../../crates/paralegal" }
p2panda-core = { path = "../p2panda-core", version = "0.5.2", default-features = false }
p2panda-store = { path = "../p2panda-store", version = "0.5.2", default-features = false }
rand = "0.8.5"
rand_chacha = { version = "0.10.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["sync"], optional = true, default-features = false }

[dev-dependencies]
futures-channel = { version = "0.3.31", features = ["sink"] }
p2panda-discovery = { path = ".", features = ["test_utils"] }
p2panda-store = { path = "../p2panda-store", version = "0.5.2", default-features = false, features = ["test_utils", "sqlite", "macros"] }
tokio = { version = "1.48.0", features = ["macros", "rt", "sync"] }
